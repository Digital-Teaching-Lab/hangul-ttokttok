<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#fff8e9"><title>한글 톡톡</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
:root{--ink:#29314b;--muted:#77809a;--cream:#fff8e9;--paper:#fffdf8;--blue:#4d8bf5;--pink:#ff7895;--yellow:#ffd45c;--green:#51c6a5;--purple:#9874e8;--shadow:0 10px 28px #34405e18}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:'Jua','Malgun Gothic',sans-serif;min-height:100vh;touch-action:manipulation}button,input{font:inherit}button{cursor:pointer;color:inherit;border:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent}button:focus-visible,input:focus-visible{outline:4px solid #29314b66;outline-offset:3px}.screen{display:none;min-height:100vh;padding:24px clamp(16px,4vw,56px) 36px}.screen.active{display:flex;flex-direction:column}.topbar{display:flex;align-items:center;justify-content:space-between;max-width:1200px;width:100%;margin:0 auto 22px}.brand{display:flex;align-items:center;gap:10px;font-size:clamp(20px,3vw,28px)}.brand-mark{background:var(--yellow);width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:25px;transform:rotate(-5deg)}.small-btn{background:#fff;border:2px solid #ece7dc;border-radius:14px;padding:10px 15px;font-size:16px;box-shadow:0 3px 0 #ece7dc}.wrap{width:min(1100px,100%);margin:auto}.hero{text-align:center;padding:10px 0 24px}.eyebrow{font-size:16px;color:#8174c7;background:#f1ebff;border-radius:99px;padding:8px 15px;display:inline-block}.hero h1{font-size:clamp(42px,8vw,76px);line-height:1.05;margin:18px 0 10px;letter-spacing:-2px}.hero h1 span{color:#ff8c52}.hero p{font-size:clamp(18px,2.6vw,24px);color:var(--muted);margin:0}.setup-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:8px auto 24px;max-width:850px}.setup-card{background:var(--paper);border:2px solid #f1eadc;border-radius:24px;padding:22px;box-shadow:var(--shadow)}.setup-card h2{font-size:21px;margin:0 0 15px}.mode-list{display:grid;gap:10px}.mode-option{background:#fff;border:2px solid #eee9df;border-radius:17px;padding:13px 15px;text-align:left;display:flex;gap:12px;align-items:center;min-height:65px}.mode-option.selected{border-color:var(--blue);background:#f1f6ff;box-shadow:0 0 0 2px #4d8bf522}.mode-icon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#fff0d3;font-size:21px;flex:none}.mode-option strong{font-size:18px;display:block}.mode-option small{font-size:14px;color:var(--muted);display:block;margin-top:3px}.count-row{display:flex;gap:10px}.count-btn{background:#fff;border:2px solid #eee9df;border-radius:15px;flex:1;padding:12px 3px;font-size:17px}.count-btn.selected{background:#effcf8;border-color:var(--green)}.name-list{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.name-chip{display:flex;align-items:center;gap:5px;background:#f6f4ef;border-radius:12px;padding:6px 9px}.name-chip input{width:78px;border:0;background:transparent;color:var(--ink);font-size:15px;outline:none}.rules{font-size:14px;color:var(--muted);line-height:1.6;margin:14px 0 0}.start-wrap{text-align:center}.start-btn{background:var(--blue);color:#fff;border-radius:20px;padding:16px 54px;font-size:27px;box-shadow:0 6px 0 #3670cf;transition:transform .12s}.start-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #3670cf}.hint-under{font-size:14px;color:var(--muted);margin-top:12px}.game-head{max-width:1300px;width:100%;margin:0 auto 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}.game-title{font-size:clamp(22px,3vw,32px)}.game-tools{display:flex;align-items:center;gap:10px}.timer{background:#fff;border-radius:15px;padding:9px 17px;font-size:25px;min-width:94px;text-align:center;box-shadow:var(--shadow);font-variant-numeric:tabular-nums}.arena{display:grid;grid-template-columns:repeat(var(--players,2),minmax(0,1fr));gap:14px;width:100%;max-width:1500px;margin:auto}.lane{background:var(--paper);border:3px solid var(--lane-color);border-radius:25px;padding:14px;box-shadow:var(--shadow);min-width:0;position:relative;overflow:hidden}.lane-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 2px 10px}.player-name{font-size:clamp(18px,2.2vw,25px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.player-stat{font-size:15px;color:var(--muted);white-space:nowrap}.target-area{height:clamp(75px,13vh,120px);background:#f5f6fb;border-radius:17px;display:flex;align-items:center;justify-content:center;gap:15px;margin-bottom:11px;position:relative}.target-letter{font-size:clamp(42px,7vw,68px);color:var(--lane-color);line-height:1}.target-label{font-size:15px;color:var(--muted)}.target-count{font-size:18px;color:var(--ink)}.progress-track{position:absolute;bottom:8px;left:12px;right:12px;height:6px;border-radius:9px;background:#e7e9f0;overflow:hidden}.progress-fill{height:100%;width:0;background:var(--lane-color);border-radius:9px;transition:width .2s}.letters{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(5px,.9vw,10px)}.letter{aspect-ratio:1.08;background:#fff;border:2px solid #eee9df;border-radius:16px;font-size:var(--letter-size,clamp(27px,4vw,44px));box-shadow:0 4px 0 #ece7dc;transition:transform .08s,background .1s;user-select:none}.letter:active{transform:translateY(3px);box-shadow:0 1px 0 #ece7dc}.letter.correct{background:#ddf8ee;border-color:#51c6a5;color:#188564}.letter.wrong{background:#fff0ef;border-color:#fa9189;animation:shake .22s}.letter.cleared{background:#f5f6fb;border:2px dashed #e2e4ea;box-shadow:none;pointer-events:none}.lane.done{background:#f2fff9}.lane.done:after{content:'완료! 🎉';position:absolute;inset:0;background:#ffffffd9;display:grid;place-items:center;font-size:clamp(36px,6vw,65px);color:var(--green);z-index:2}.status-line{height:23px;text-align:center;font-size:15px;color:var(--muted);padding-top:5px}.game-footer{max-width:1200px;width:100%;margin:16px auto 0;display:flex;justify-content:center;gap:10px}.soft-btn{background:#fff;border:2px solid #ece7dc;border-radius:14px;padding:10px 19px;font-size:17px}.result-wrap{width:min(780px,100%);margin:auto;text-align:center}.result-burst{font-size:60px}.result-wrap h1{font-size:clamp(38px,7vw,62px);margin:0 0 5px}.result-sub{font-size:20px;color:var(--muted);margin-bottom:24px}.podium{display:grid;gap:10px;text-align:left}.rank-row{background:#fff;border:2px solid #f0eadf;border-radius:19px;padding:13px 17px;display:flex;align-items:center;gap:13px;box-shadow:var(--shadow)}.rank-num{width:45px;height:45px;border-radius:15px;display:grid;place-items:center;background:#f5f3ee;font-size:24px}.rank-row:first-child .rank-num{background:#fff0bd}.rank-name{font-size:22px;flex:1}.rank-time{font-size:20px;color:var(--muted);font-variant-numeric:tabular-nums}.rank-detail{font-size:14px;color:var(--muted)}.result-actions{display:flex;gap:12px;justify-content:center;margin-top:25px}.primary-btn{background:var(--blue);color:white;border-radius:16px;padding:13px 27px;font-size:21px;box-shadow:0 4px 0 #3670cf}.secondary-btn{background:#fff;border:2px solid #eee9df;border-radius:16px;padding:13px 23px;font-size:20px}.best-time{margin:22px auto 0;background:#f1ecff;border-radius:16px;padding:12px;color:#6853ad;max-width:440px;font-size:16px}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,30px);opacity:0;background:#29314b;color:white;border-radius:13px;padding:11px 17px;transition:.2s;pointer-events:none;z-index:5}.toast.show{opacity:1;transform:translate(-50%,0)}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media(max-width:760px){.setup-grid{grid-template-columns:1fr}.screen{padding:14px}.arena{grid-template-columns:repeat(min(var(--players,2),2),minmax(0,1fr));gap:8px}.lane{padding:9px;border-radius:18px}.letter{border-radius:12px}.target-area{height:75px}.letters{gap:5px}.game-head{margin-bottom:10px}.game-title{font-size:19px}.timer{font-size:20px;min-width:77px}.game-tools .small-btn{padding:8px 10px}.player-name{font-size:17px}.player-stat{font-size:12px}.target-count{font-size:15px}.target-label{font-size:13px}.status-line{font-size:12px}}
@media(max-width:520px){.arena{grid-template-columns:repeat(min(var(--players,2),2),minmax(0,1fr))}.lane{padding:7px}.letter{font-size:var(--letter-size,32px)}.game-tools{gap:5px}.game-head{align-items:flex-start}.game-title{max-width:120px}.rank-row{padding:10px}.result-actions{flex-direction:column}.hero h1{letter-spacing:-1px}}
.pause-overlay{display:none;position:fixed;inset:0;z-index:10;background:#fff8e9bf;backdrop-filter:blur(3px);align-items:center;justify-content:center;padding:20px}.pause-overlay.show{display:flex}.pause-card{background:#fffdf8;border:3px solid #e9e1d3;border-radius:28px;padding:30px 40px;text-align:center;box-shadow:0 14px 40px #29314b28}.pause-card .pause-emoji{font-size:54px}.pause-card h2{font-size:clamp(30px,6vw,46px);margin:8px 0}.pause-card p{font-size:18px;color:var(--muted);margin:0 0 20px}.resume-btn{background:var(--green);color:white;border-radius:17px;padding:14px 28px;font-size:23px;box-shadow:0 5px 0 #309d7e}
.record-list{display:grid;gap:13px;text-align:left}.record-card{background:#fff;border:2px solid #f0eadf;border-radius:18px;padding:14px 17px;box-shadow:var(--shadow)}.record-card h2{font-size:20px;margin:0 0 8px}.record-row{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:9px;padding:8px 0;border-top:1px solid #f2eee7}.record-row:first-of-type{border-top:0}.record-rank{font-size:18px}.record-player{font-size:18px}.record-meta{font-size:13px;color:var(--muted);margin-top:2px}.record-best{text-align:right;font-size:17px;color:#6956b3}.record-empty{text-align:center;color:var(--muted);background:#fff;border-radius:18px;padding:25px}
.letter[data-font="round"]{font-family:'Jua','Malgun Gothic',sans-serif}.letter[data-font="clear"]{font-family:'Malgun Gothic','Arial',sans-serif;font-weight:700}.letter[data-font="serif"]{font-family:'Batang','바탕','Times New Roman',serif;font-weight:700}.letter[data-font="soft"]{font-family:'Gulim','굴림','Malgun Gothic',sans-serif;font-weight:600;letter-spacing:-2px}
</style></head><body>
<section id="setup" class="screen active"><header class="topbar"><div class="brand"><span class="brand-mark">가</span> 한글 톡톡</div><button id="openRecords" class="small-btn">📒 오늘의 기록</button></header><main class="wrap"><div class="hero"><span class="eyebrow">손가락으로 톡톡!</span><h1>한글 <span>톡톡</span></h1><p>한글을 누가 먼저 찾을까?</p></div>
<div class="setup-grid"><article class="setup-card"><h2>🎮 게임 고르기</h2><div class="mode-list">
<button class="mode-option selected" data-mode="shown"><span class="mode-icon">👀</span><span><strong>순서 보고 찾기</strong><small>ㄱ~ㅎ 순서대로 찾아요</small></span></button>
<button class="mode-option" data-mode="race"><span class="mode-icon">⚡</span><span><strong>글자 빨리 찾기</strong><small>ㄱ~ㅎ 글자를 랜덤으로 찾아요</small></span></button>
<button class="mode-option" data-mode="open"><span class="mode-icon">🔎</span><span><strong>받침 없는 글자 찾기</strong><small>가, 나, 다 같은 글자를 찾아요</small></span></button>
<button class="mode-option" data-mode="closed"><span class="mode-icon">🧩</span><span><strong>받침 있는 글자 찾기</strong><small>각, 간, 갈 같은 글자를 찾아요</small></span></button>
</div></article><article class="setup-card"><h2>👧 함께할 친구</h2><div class="count-row"><button class="count-btn selected" data-count="1">혼자하기</button><button class="count-btn" data-count="2">친구와 같이하기 (2명)</button></div><div id="names" class="name-list"></div><p class="rules">친구마다 자기 칸에서 눌러요. 여러 손가락으로 동시에 눌러도 괜찮아요! 순서 게임은 ㄱ~ㅎ, 글자 찾기에서는 받침을 살펴봐요.</p></article></div>
<div class="start-wrap"><button id="start" class="start-btn">시작하기 <span>▶</span></button><div class="hint-under">준비되면 친구들과 함께 눌러주세요!</div></div></main></section>
<section id="game" class="screen"><header class="game-head"><div class="game-title" id="gameTitle">순서 보고 찾기</div><div class="game-tools"><div id="timer" class="timer">00:00</div><button id="restart" class="small-btn">↻ 다시</button><button id="quit" class="small-btn">나가기</button></div></header><main id="arena" class="arena"></main><footer class="game-footer"><button id="pause" class="soft-btn">⏸ 잠깐 멈춤</button></footer></section><div id="pauseOverlay" class="pause-overlay"><div class="pause-card"><div class="pause-emoji">☕</div><h2>잠깐 쉬어요!</h2><p>준비되면 다시 시작해요.</p><button id="resume" class="resume-btn">▶ 다시 하기</button></div></div>
<section id="results" class="screen"><main class="result-wrap"><div class="result-burst">🏆</div><h1>참 잘했어요!</h1><div class="result-sub">오늘의 한글 톡톡 순위</div><div id="podium" class="podium"></div><div id="bestTime" class="best-time"></div><div class="result-actions"><button id="again" class="primary-btn">한 번 더 하기</button><button id="showRecords" class="secondary-btn">오늘의 기록 보기</button><button id="home" class="secondary-btn">처음으로</button></div></main></section>
<section id="records" class="screen"><main class="result-wrap"><div class="result-burst">📒</div><h1>오늘의 기록</h1><div class="result-sub">게임 방식별 아이들의 최고 시간</div><div id="recordList" class="record-list"></div><div class="best-time">기록은 이 페이지를 열어둔 동안만 보관돼요.</div><div class="result-actions"><button id="recordsBack" class="primary-btn">게임으로 돌아가기</button></div></main></section><div id="toast" class="toast"></div>
<script>
(()=>{'use strict';
const ABC=['ㄱ','ㄴ','ㄷ','ㄹ','ㅁ','ㅂ','ㅅ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const OPEN_SYLLABLES=['가','야','너','여','도','요','루','유','그','기','새','세','와','귀'];
const CLOSED_SYLLABLES=['각','간','갈','감','강','난','날','남','밤','밥','산','손','집','공'];
const COLORS=['#4d8bf5','#ff7895','#51b997','#9874e8'];
let mode='shown',count=1,players=[],startedAt=0,tick=null,paused=false,pausedAt=0,elapsedBeforePause=0,round=0,results=[];
const sessionRecords={shown:{},race:{},open:{},closed:{}};
const $=s=>document.querySelector(s), screens={setup:$('#setup'),game:$('#game'),results:$('#results'),records:$('#records')};
function show(which){Object.values(screens).forEach(x=>x.classList.remove('active'));screens[which].classList.add('active')}
function makeNames(){const box=$('#names');box.innerHTML='';for(let i=0;i<count;i++){const chip=document.createElement('label');chip.className='name-chip';chip.innerHTML=`<span>${['🔵','🩷','🟢','🟣'][i]}</span><input aria-label="친구 ${i+1} 이름" maxlength="8" value="친구 ${i+1}">`;box.append(chip)}}
document.querySelectorAll('.mode-option').forEach(b=>b.onclick=()=>{document.querySelectorAll('.mode-option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');mode=b.dataset.mode});
document.querySelectorAll('.count-btn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.count-btn').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');count=+b.dataset.count;makeNames()});
makeNames();
function shuffled(items){const a=items.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makePlayer(i,name){const symbols=mode==='open'?OPEN_SYLLABLES:mode==='closed'?CLOSED_SYLLABLES:ABC,deck=shuffled(symbols);return {name,color:COLORS[i],next:0,errors:0,done:false,finish:null,turns:0,target:deck[0],deck,board:shuffled(symbols),styles:Object.fromEntries(symbols.map((l,j)=>[l,['round','clear','serif','soft'][j%4]])),sizes:Object.fromEntries(symbols.map(l=>[l,`${Math.round(28+Math.random()*20)}px`]))}}
function startGame(){players=[...document.querySelectorAll('#names input')].map((x,i)=>makePlayer(i,x.value.trim()||`친구 ${i+1}`));round=0;results=[];paused=false;elapsedBeforePause=0;$('#pauseOverlay').classList.remove('show');$('#pause').textContent='⏸ 잠깐 멈춤';startedAt=performance.now();$('#gameTitle').textContent=mode==='shown'?'순서 보고 찾기':mode==='race'?'글자 빨리 찾기':mode==='open'?'받침 없는 글자 찾기':'받침 있는 글자 찾기';show('game');renderArena();if(tick)clearInterval(tick);tick=setInterval(updateTimer,100);updateTimer()}
function renderArena(){const arena=$('#arena');arena.style.setProperty('--players',players.length);arena.innerHTML='';players.forEach((p,i)=>{const lane=document.createElement('article');lane.className='lane';lane.dataset.index=i;lane.style.setProperty('--lane-color',p.color);lane.innerHTML=`<div class="lane-head"><div class="player-name">${escapeHtml(p.name)}</div><div class="player-stat" id="stat${i}"></div></div><div class="target-area" id="target${i}"></div><div class="letters">${p.board.map(l=>`<button class="letter" data-font="${p.styles[l]}" style="--letter-size:${p.sizes[l]}" data-letter="${l}" aria-label="${l}">${l}</button>`).join('')}</div><div class="status-line" id="status${i}"></div>`;lane.querySelectorAll('.letter').forEach(btn=>btn.addEventListener('pointerdown',e=>{e.preventDefault();press(i,btn.dataset.letter,btn)}));arena.append(lane);updateLane(i)})}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function updateLane(i){const p=players[i],lane=document.querySelector(`.lane[data-index="${i}"]`),target=$(`#target${i}`);if(!lane)return;const prompting=mode!=='shown',total=prompting?p.deck.length:ABC.length,n=prompting?p.turns:p.next;$('#stat'+i).textContent=`진행 ${Math.min(n,total)} / ${total}`;const label=mode==='shown'?'다음 글자':mode==='race'?'빨리 찾아요!':mode==='open'?'받침 없는 글자':'받침 있는 글자';target.innerHTML=`<span class="target-label">${label}</span><span class="target-letter">${prompting?(p.target||'🎉'):(ABC[p.next]||'🎉')}</span><span class="target-count">${Math.min(n+1,total)} / ${total}</span><div class="progress-track"><div class="progress-fill" style="width:${n/total*100}%"></div></div>`;if(p.done)lane.classList.add('done')}
function press(i,letter,btn){const p=players[i];if(p.done||paused||btn.disabled)return;const prompting=mode!=='shown',correct=prompting?letter===p.target:letter===ABC[p.next];btn.classList.remove('correct','wrong');void btn.offsetWidth;btn.classList.add(correct?'correct':'wrong');setTimeout(()=>btn.classList.remove('correct','wrong'),210);if(correct){btn.disabled=true;setTimeout(()=>{btn.textContent='';btn.classList.remove('correct');btn.classList.add('cleared');btn.removeAttribute('data-letter');btn.setAttribute('aria-label','빈 자리')},220);if(prompting){p.turns++;if(p.turns>=p.deck.length)finishPlayer(i);else{p.target=p.deck[p.turns];updateLane(i)}if(players.every(x=>x.done))finishGame()}else{p.next++;if(p.next>=ABC.length)finishPlayer(i);updateLane(i);if(players.every(x=>x.done))finishGame()}}else{p.errors++;$('#status'+i).textContent='다시 찾아볼까요?';setTimeout(()=>{if($('#status'+i))$('#status'+i).textContent=''},650)}}
function finishPlayer(i){const p=players[i];if(p.done)return;p.done=true;p.finish=activeSeconds();results.push({name:p.name,time:p.finish,errors:p.errors});updateLane(i)}
function activeSeconds(){return (paused?pausedAt:performance.now())-startedAt-elapsedBeforePause}
function updateTimer(){const s=Math.floor(activeSeconds()/1000);$('#timer').textContent=`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function finishGame(){clearInterval(tick);tick=null;const ordered=[...results].sort((a,b)=>a.time-b.time||a.errors-b.errors);saveSessionRecords(ordered);$('#podium').innerHTML=ordered.map((p,i)=>`<div class="rank-row"><div class="rank-num">${['🥇','🥈','🥉','4'][i]}</div><div class="rank-name">${escapeHtml(p.name)}<div class="rank-detail">틀린 횟수 ${p.errors}번</div></div><div class="rank-time">${fmt(p.time)}</div></div>`).join('');const fastest=ordered[0];$('#bestTime').textContent=`가장 빠른 친구: ${fastest.name} · ${fmt(fastest.time)}  ✨`;show('results')}
function saveSessionRecords(ordered){const group=sessionRecords[mode];ordered.forEach(p=>{const r=group[p.name]||(group[p.name]={name:p.name,bestTime:Infinity});if(p.time<r.bestTime)r.bestTime=p.time})}
function renderRecords(){const list=$('#recordList'),groups=[['shown','순서 보고 찾기'],['race','글자 빨리 찾기'],['open','받침 없는 글자 찾기'],['closed','받침 있는 글자 찾기']];let html='';groups.forEach(([key,title])=>{const rows=Object.values(sessionRecords[key]).sort((a,b)=>a.bestTime-b.bestTime);if(!rows.length)return;html+=`<article class="record-card"><h2>${title}</h2>${rows.map((r,i)=>`<div class="record-row"><div class="record-rank">${['🥇','🥈','🥉'][i]||`${i+1}.`}</div><div class="record-player">${escapeHtml(r.name)}</div><div class="record-best">${fmt(r.bestTime)}</div></div>`).join('')}</article>`});list.innerHTML=html||'<div class="record-empty">아직 기록이 없어요.<br>게임을 한 판 마치면 기록이 생겨요!</div>'}
function fmt(ms){const s=ms/1000;return `${s.toFixed(1)}초`}
$('#start').onclick=startGame;$('#restart').onclick=()=>{if(confirm('이번 게임을 처음부터 다시 시작할까요?'))startGame()};$('#quit').onclick=()=>{clearInterval(tick);tick=null;$('#pauseOverlay').classList.remove('show');show('setup')};$('#again').onclick=startGame;$('#home').onclick=()=>show('setup');$('#openRecords').onclick=()=>{renderRecords();show('records')};$('#showRecords').onclick=()=>{renderRecords();show('records')};$('#recordsBack').onclick=()=>show('setup');function togglePause(){if(!paused){paused=true;pausedAt=performance.now();$('#pause').textContent='▶ 다시 하기';$('#pauseOverlay').classList.add('show')}else{elapsedBeforePause+=performance.now()-pausedAt;paused=false;$('#pause').textContent='⏸ 잠깐 멈춤';$('#pauseOverlay').classList.remove('show')}updateTimer()}$('#pause').onclick=togglePause;$('#resume').onclick=togglePause;
})();
</script></body></html>
